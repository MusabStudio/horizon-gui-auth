[package]
name = "horizon-auth-mod"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The launcher replaces this with the Horizon source it builds the game from.
# Every other dependency and feature is in Horizon's Cargo.lock (docs/native-mods.md,
# "Dependencies come from Horizon's Cargo.lock"); rusqlite is one of the mod-only
# crates listed in crates/horizon-mod-deps/Cargo.toml.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "084b20d5cfbb104d4a70f61091198831074619f1" }
base64 = "0.22"
getrandom = "0.3"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
# PBKDF2-HMAC-SHA256: `pbkdf2`, `hmac` and `sha2` are all already in Horizon's
# Cargo.lock, so offline resolution against the lock succeeds. `scrypt` is in the
# lock too, but its `password-hash` dependency is not, which fails the build.
pbkdf2 = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
